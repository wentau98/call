name: Build iOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install CocoaPods
        run: |
          pod install
      
      - name: Build
        run: |
          xcodebuild -workspace VideoCall.xcworkspace \
            -scheme VideoCall \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/VideoCall.xcarchive \
            archive
      
      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/VideoCall.xcarchive \
            -exportPath ./build/ \
            -exportOptionsPlist ExportOptions.plist
      
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: VideoCall.ipa
          path: ios/build/VideoCall.ipa
